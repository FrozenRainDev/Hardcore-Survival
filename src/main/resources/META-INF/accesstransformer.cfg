# ==============================================================================
# DEPRECATION NOTICE:
# The following Access Transformer definitions were replaced with Mixin (@Accessor / @Invoker).
#
# Reason:
# Falling into the XY problem - attempting to access private/protected members
# by altering bytecode visibility via AT caused recompilation failures
# (e.g. "cannot reduce visibility of inherited method" across deep hierarchy trees
# like LivingEntity -> AbstractHorse, Fox, Frog, Goat, and Zombie -> Husk).
#
# All member accesses have been delegated to Mixin accessors/invokers to keep
# class hierarchy contracts untouched.
# ==============================================================================

